# AI player bot configuration (dev environment ONLY)
server_url: http://localhost:8180
cycle_interval_s: 10
control_port_base: 9300

strategy:
  weights:
    defense: 3
    attack: 2
  # Strategy lifetime as a wall-clock window [min, max] hours.
  duration_hours:
    defense: [3, 8]
    attack: [1, 3]

# Per-bot temperament: multipliers applied to the base strategy weights above.
# A bot's personality is rolled once at account creation (see bot/state.py).
# Missing personality → "balanced" (all x1.0).
personalities:
  aggressive: {defense: 0.5, attack: 3.0}
  defensive:  {defense: 3.0, attack: 0.5}
  balanced:   {defense: 1.0, attack: 1.0}

# Probability that a bot reacts to an AI breach by force-switching to defense.
breach_response_chance:
  aggressive: 0.2
  defensive:  1.0
  balanced:   0.6

# Probability that a LOST attack force-switches the bot back to attack (revenge).
attack_defeat_response_chance:
  aggressive: 0.9
  defensive:  0.2
  balanced:   0.6

# Weighted top-N sampling: instead of always taking the single best candidate,
# planners sample from the best `top_n` options (better = higher probability).
selection:
  top_n: 3

# Dispatcher option scoring: multiplier per category per personality.
category_weights:
  aggressive: {defense: 0.7, attack: 1.6, baseline: 1.0}
  defensive:  {defense: 1.6, attack: 0.6, baseline: 1.0}
  balanced:   {defense: 1.0, attack: 1.0, baseline: 1.0}

# Extra multiplier for options matching the active strategy.
active_strategy_boost: 1.5
