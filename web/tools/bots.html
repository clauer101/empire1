<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bot Status</title>
  <style>
    :root {
      --bg:          #0d0d14;
      --surface:     #14141f;
      --surface-alt: #1a1a28;
      --border:      #2a2a3a;
      --accent:      #4fc3f7;
      --success:     #66bb6a;
      --danger:      #ef5350;
      --warning:     #ffa726;
      --purple:      #ab47bc;
      --teal:        #26c6da;
      --text:        #e0e0e6;
      --text-dim:    #9999a8;
      --mono:        'JetBrains Mono', 'Fira Code', monospace;
      --radius:      6px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      min-height: 100vh;
    }
    h1 { font-size: 20px; font-weight: 600; color: var(--accent); }
    h2 { font-size: 14px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px; }
    h3 { font-size: 13px; font-weight: 600; margin-bottom: 8px; }

    .page-header {
      display: flex; align-items: center; gap: 12px;
      padding: 18px 24px 14px;
      border-bottom: 1px solid var(--border);
    }
    .page-header .refresh-btn {
      margin-left: auto;
      background: var(--surface-alt); border: 1px solid var(--border);
      color: var(--text); border-radius: var(--radius); padding: 5px 14px;
      cursor: pointer; font-size: 12px;
    }
    .page-header .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
    .last-updated { font-size: 11px; color: var(--text-dim); margin-left: 4px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(520px, 1fr)); gap: 20px; padding: 20px 24px; }

    .bot-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .bot-card.offline { opacity: .55; }

    .card-header {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-alt);
    }
    .bot-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
      background: var(--success);
      box-shadow: 0 0 6px var(--success);
    }
    .bot-dot.offline { background: var(--text-dim); box-shadow: none; }
    .card-header .bot-name { font-size: 15px; font-weight: 600; }
    .card-header .bot-meta { font-size: 11px; color: var(--text-dim); margin-left: auto; }
    .card-header .delete-btn {
      flex-shrink: 0;
      background: none; border: 1px solid transparent;
      color: var(--text-dim); border-radius: var(--radius); padding: 2px 8px;
      cursor: pointer; font-size: 11px; transition: all .15s;
    }
    .card-header .delete-btn:hover { border-color: var(--danger); color: var(--danger); }

    .card-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 16px; }

    /* Strategy badge */
    .strategy-now {
      display: flex; align-items: center; gap: 10px;
    }
    .strat-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
    }
    .strat-badge.defense  { background: #1a1a2e; border: 1px solid var(--accent);   color: var(--accent); }
    .strat-badge.attack   { background: #2a1a1a; border: 1px solid var(--danger);   color: var(--danger); }
    .strat-badge.unknown  { background: var(--surface-alt); border: 1px solid var(--border); color: var(--text-dim); }

    .source-tag {
      font-size: 10px; padding: 2px 7px; border-radius: 10px;
      background: var(--surface-alt); border: 1px solid var(--border); color: var(--text-dim);
    }
    .source-tag.breach { border-color: var(--danger); color: var(--danger); }
    .source-tag.override { border-color: var(--warning); color: var(--warning); }

    .valid-until { font-size: 11px; color: var(--text-dim); }

    /* Stats row */
    .stats-row { display: flex; gap: 16px; flex-wrap: wrap; }
    .stat-box {
      background: var(--surface-alt); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 8px 14px; min-width: 90px;
    }
    .stat-box .label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; }
    .stat-box .value { font-size: 18px; font-weight: 700; margin-top: 2px; }
    .stat-box .value.danger { color: var(--danger); }
    .stat-box .value.warning { color: var(--warning); }
    .stat-box .value.accent { color: var(--accent); }

    /* Strategy Gantt chart (last 24 h) */
    .gantt { margin-top: 8px; }
    .gantt-track {
      position: relative; height: 22px; width: 100%;
      background: var(--surface-alt); border: 1px solid var(--border);
      border-radius: 4px; overflow: hidden;
    }
    .gantt-bar {
      position: absolute; top: 0; bottom: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 600; white-space: nowrap; overflow: hidden;
      border-right: 1px solid rgba(0,0,0,.35); cursor: default;
    }
    .gantt-bar.defense  { background: #1a1a2e; color: var(--accent); }
    .gantt-bar.attack   { background: #2a1a1a; color: var(--danger); }
    .gantt-bar.unknown  { background: var(--surface-alt); color: var(--text-dim); }
    .gantt-bar.breach { box-shadow: inset 0 -3px 0 var(--danger); }
    .gantt-axis {
      display: flex; justify-content: space-between;
      font-size: 9px; color: var(--text-dim); font-family: var(--mono);
      margin-top: 3px;
    }

    /* Winrate */
    .winrate-block { display: flex; gap: 16px; flex-wrap: wrap; align-items: stretch; }
    .winrate-big {
      background: var(--surface-alt); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 8px 16px; min-width: 100px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .winrate-big .value { font-size: 22px; font-weight: 700; }
    .winrate-big .label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; }
    .era-rates { display: flex; flex-direction: column; gap: 3px; justify-content: center; }
    .era-row { display: flex; gap: 8px; align-items: center; font-size: 11px; }
    .era-row .era-name { width: 68px; color: var(--text-dim); text-transform: capitalize; }
    .era-row .era-bar-track { width: 80px; height: 6px; border-radius: 3px; background: var(--surface); overflow: hidden; }
    .era-row .era-bar-fill { height: 100%; background: var(--accent); }
    .era-row .era-count { color: var(--text-dim); font-family: var(--mono); }

    /* Last gold spends */
    .goldspend-list { display: flex; flex-direction: column; gap: 5px; }
    .goldspend-row {
      display: flex; align-items: baseline; gap: 8px;
      padding: 6px 10px; border-radius: var(--radius);
      background: var(--surface-alt); border: 1px solid var(--border);
      font-size: 11px;
    }
    .goldspend-desc { color: var(--text); flex: 1; overflow-wrap: anywhere; }
    .goldspend-strategy {
      font-size: 10px; font-weight: 600; flex-shrink: 0;
      padding: 1px 8px; border-radius: 10px;
    }
    .goldspend-strategy.defense  { color: var(--accent);  border: 1px solid var(--accent); }
    .goldspend-strategy.attack   { color: var(--danger);  border: 1px solid var(--danger); }
    .goldspend-strategy.economy  { color: var(--warning); border: 1px solid var(--warning); }
    .goldspend-strategy.growth   { color: var(--success); border: 1px solid var(--success); }
    .goldspend-strategy.unknown  { color: var(--text-dim); border: 1px solid var(--border); }
    .goldspend-ts { font-size: 10px; color: var(--text-dim); flex-shrink: 0; font-family: var(--mono); }

    /* Last 10 battles */
    .last10-row { display: flex; align-items: center; gap: 8px; }
    .last10-label { font-size: 10px; color: var(--text-dim); width: 56px; flex-shrink: 0; }
    .last10-dots { display: flex; gap: 3px; }
    .last10-dot {
      width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; cursor: default;
    }
    .last10-dot.win  { background: var(--success); }
    .last10-dot.loss { background: var(--danger); }

    /* Skills */
    .skills { display: flex; flex-direction: column; gap: 6px; }
    .skill {
      display: flex; gap: 10px; align-items: flex-start;
      padding: 8px 10px; border-radius: var(--radius);
      background: var(--surface-alt); border: 1px solid var(--border);
    }
    .skill-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
    .skill-name { font-size: 12px; font-weight: 600; }
    .skill-desc { font-size: 11px; color: var(--text-dim); margin-top: 2px; line-height: 1.5; }

    /* Capabilities (collapsible) */
    .capabilities {
      background: var(--surface-alt); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 8px 12px;
    }
    .capabilities > summary {
      cursor: pointer; list-style: none; display: flex; align-items: baseline;
      gap: 10px; user-select: none;
    }
    .capabilities > summary::-webkit-details-marker { display: none; }
    .capabilities > summary::before {
      content: '▸'; color: var(--text-dim); font-size: 11px;
      transition: transform .15s; display: inline-block;
    }
    .capabilities[open] > summary::before { transform: rotate(90deg); }
    .cap-hint { font-size: 10px; color: var(--text-dim); font-style: italic; }

    .skill-group { margin-top: 8px; }
    .skill-group-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; font-size: 11px; font-weight: 700; color: var(--text);
      margin-bottom: 4px;
    }
    .weight-badge {
      font-size: 10px; font-weight: 600; font-family: var(--mono);
      padding: 1px 7px; border-radius: 10px;
      background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
    }
    .weight-badge.up   { color: var(--success); border-color: var(--success); }
    .weight-badge.down { color: var(--danger);  border-color: var(--danger); }

    /* Personality tag in header */
    .personality-tag {
      font-size: 10px; font-weight: 600; text-transform: capitalize;
      padding: 2px 9px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--surface-alt); color: var(--text-dim);
    }
    .personality-tag.aggressive { color: var(--danger);  border-color: var(--danger); }
    .personality-tag.defensive  { color: var(--accent);  border-color: var(--accent); }
    .personality-tag.balanced   { color: var(--text-dim); }

    /* Savings goal */
    .savings-goal {
      background: #1f1a0e; border: 1px solid var(--warning);
      border-radius: var(--radius); padding: 8px 12px;
      display: flex; gap: 10px; align-items: center;
    }
    .savings-goal .sg-amount { font-size: 16px; font-weight: 700; color: var(--warning); }
    .savings-goal .sg-meta { font-size: 11px; color: var(--text-dim); }

    /* Section labels */
    .section-label {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .08em; color: var(--text-dim);
      padding-bottom: 6px; border-bottom: 1px solid var(--border);
      margin-bottom: 2px;
    }

    /* Code + markdown block */
    .md-block {
      background: var(--surface-alt); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 14px;
      font-size: 11px; color: var(--text-dim); line-height: 1.6;
    }
    .md-block code { font-family: var(--mono); color: var(--accent); }
    .md-block strong { color: var(--text); }

    .empty-msg { font-size: 12px; color: var(--text-dim); font-style: italic; }
    .hidden { display: none !important; }

    /* Spawn modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.6);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal-overlay.hidden { display: none; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 24px; width: 340px; display: flex;
      flex-direction: column; gap: 14px;
    }
    .modal h3 { font-size: 15px; font-weight: 600; color: var(--accent); }
    .modal label { font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 5px; }
    .modal input, .modal select {
      width: 100%; background: var(--surface-alt); border: 1px solid var(--border);
      color: var(--text); border-radius: var(--radius); padding: 7px 10px;
      font-size: 13px;
    }
    .modal input:focus, .modal select:focus { outline: none; border-color: var(--accent); }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
    .btn-primary {
      background: var(--accent); color: #000; border: none;
      border-radius: var(--radius); padding: 7px 18px; font-size: 13px;
      font-weight: 600; cursor: pointer;
    }
    .btn-primary:hover { opacity: .85; }
    .btn-primary:disabled { opacity: .5; cursor: default; }
    .btn-cancel {
      background: none; border: 1px solid var(--border); color: var(--text-dim);
      border-radius: var(--radius); padding: 7px 14px; font-size: 13px; cursor: pointer;
    }
    .btn-cancel:hover { border-color: var(--text-dim); }
    .spawn-btn {
      background: var(--surface-alt); border: 1px solid var(--accent);
      color: var(--accent); border-radius: var(--radius); padding: 5px 14px;
      cursor: pointer; font-size: 12px; font-weight: 600;
    }
    .spawn-btn:hover { background: var(--accent); color: #000; }

    /* Override strategy button */
    .override-btn {
      background: none; border: 1px solid var(--warning);
      color: var(--warning); border-radius: var(--radius); padding: 2px 8px;
      cursor: pointer; font-size: 11px; transition: all .15s;
    }
    .override-btn:hover { background: var(--warning); color: #000; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<div class="page-header">
  <h1>🤖 Bot Status</h1>
  <span class="last-updated" id="lastUpdated"></span>
  <button class="spawn-btn" onclick="openSpawnModal()">+ Spawn bot</button>
  <button class="refresh-btn" onclick="load()">↻ Refresh</button>
</div>

<div class="grid" id="grid"><p style="padding:24px;color:var(--text-dim)">Loading…</p></div>

<!-- Spawn bot modal -->
<div class="modal-overlay hidden" id="spawnModal" onclick="if(event.target===this)closeSpawnModal()">
  <div class="modal">
    <h3>🤖 Spawn new bot</h3>
    <div>
      <label for="spawnName">Name <span style="color:var(--text-dim);font-weight:400">(optional — leave blank for random)</span></label>
      <input id="spawnName" type="text" placeholder="e.g. GildedRaven" maxlength="15" />
    </div>
    <div>
      <label for="spawnPersonality">Personality</label>
      <select id="spawnPersonality">
        <option value="">Random</option>
        <option value="aggressive">⚔️ Aggressive</option>
        <option value="defensive">🛡️ Defensive</option>
        <option value="balanced">⚖️ Balanced</option>
      </select>
    </div>
    <p style="font-size:11px;color:var(--text-dim)">The state file will be created immediately. The bot will start on the next fleet restart.</p>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeSpawnModal()">Cancel</button>
      <button class="btn-primary" id="spawnSubmit" onclick="spawnBot()">Spawn</button>
    </div>
  </div>
</div>

<!-- Strategy override modal -->
<div class="modal-overlay hidden" id="overrideModal" onclick="if(event.target===this)closeOverrideModal()">
  <div class="modal" style="width:380px">
    <h3>⚡ Override strategy — <span id="overrideBotName" style="color:var(--text)"></span></h3>
    <div>
      <label for="overrideType">Strategy</label>
      <select id="overrideType" onchange="updateOverrideFields()">
        <option value="defense">🛡️ Defense</option>
        <option value="attack">⚔️ Attack</option>
        <option value="economy">💰 Economy</option>
      </select>
    </div>
    <div id="overrideTargetRow" class="hidden">
      <label for="overrideTarget">Target empire</label>
      <select id="overrideTarget">
        <option value="">Loading…</option>
      </select>
    </div>
    <div>
      <label for="overrideDuration">Duration (hours)</label>
      <input id="overrideDuration" type="number" min="0.5" max="24" step="0.5" value="2" />
    </div>
    <p style="font-size:11px;color:var(--text-dim)">Sent immediately to the bot's control port. Takes effect on its next cycle (~15 s).</p>
    <div id="overrideError" style="font-size:12px;color:var(--danger);display:none"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeOverrideModal()">Cancel</button>
      <button class="btn-primary" id="overrideSubmit" onclick="submitOverride()">Override</button>
    </div>
  </div>
</div>

<script src="nav.js"></script>
<script>
// Bot status is served by the web server (has direct fs access), not the gameserver
const GS_BASE = window.location.protocol + '//' + window.location.host;

// Personality → strategy-weight multipliers, filled from the API each load.
let PERSONALITIES = {};

// ── Skills catalogue — mirrors ai_players/docs/strategies/ ─────────────────
const SKILLS = {
  all: [
    { icon: '🏰', name: 'Defense floor (baseline)',
      desc: 'Minimum <code>2 + 2×era_rank</code> towers at all times — buys tiles and places towers in <em>every</em> strategy. Counts live from the map, not the battle snapshot.' },
    { icon: '🔥', name: 'Breach response (baseline)',
      desc: 'One defensive action (tower / tile / upgrade) runs before the strategy on the very next cycle after any breach. A full <strong>defense strategy switch</strong> may also fire, gated by personality (<code>breach_response_chance</code>): defensive bots always react, aggressive bots often shrug it off.' },
    { icon: '📚', name: 'Idle-queue fill (baseline)',
      desc: 'Keeps research and build queues busy at all times — cheapest affordable item each cycle. Paused while a savings goal is active.' },
    { icon: '💰', name: 'Savings goals',
      desc: 'When a desired purchase (tower, tile, army) is unaffordable, a goal is declared. Non-owning spenders only use gold above the goal amount. TTL = min(strategy remainder, 2 h).' },
    { icon: '👑', name: 'Claim ruler (baseline)',
      desc: 'Claims a ruler as soon as one is unlocked — free and strategy-independent, so defense-focused bots get one too. Skill points are then spent by the active strategy in <code>SKILL_ORDER</code> (R→Q→W→E).' },
  ],
  defense: [
    { icon: '🧭', name: 'Frontier corridor growth',
      desc: 'Grows a single walkable corridor from the castle outward (serpentine heading, turns when blocked). A new tile may touch the existing corridor at exactly one point, so the corridor never shortcuts itself.' },
    { icon: '🧱', name: 'Flanking',
      desc: 'Every corridor tile (except the two growing ends) gets all its non-corridor neighbor tiles bought, so the corridor ends up walled with towers on both sides.' },
    { icon: '📐', name: 'Coverage-scored towers',
      desc: 'Stray owned tiles are towered immediately, using the best-covering spot by interpolated path coverage (continuous hex distance, matches server targeting math).' },
    { icon: '⚖️', name: 'Tower-mix balancing',
      desc: 'Steers placed towers to <strong>damage : slow : splash ≈ 3:1:1</strong>. Picks best tower in the most under-represented class by <code>damage/reload_time × (1+range/4)</code>.' },
    { icon: '🔁', name: 'Era-swap',
      desc: 'Replaces the oldest-era placed tower with the best current-era tower (sell + rebuild in one save) whenever the quality gain outweighs the net cost — before any upgrade or growth spend.' },
    { icon: '⬆️', name: 'Targeted upgrades',
      desc: 'Upgrades the cheapest placed current-era tower when that costs less than the next tile purchase — <em>range</em> if its coverage is thin, otherwise <em>damage</em>. Capped at level 20.' },
  ],
  attack: [
    { icon: '⚔️', name: 'Attack strategy',
      desc: 'Spy → attack weakest opponent (lower era). Army cost triggers a savings goal. Victory adds loot; defeat re-rolls strategy. Duration 1–3 h.' },
  ],
};

// Mirrors ai_players/bot/analyzer.py::ERA_RANK — display order for per-era winrate.
const ERA_ORDER = [
  'stone', 'neolithic', 'bronze', 'iron', 'medieval',
  'renaissance', 'industrial', 'modern', 'future',
];

// Mirrors ai_players/bot/strategy.py: STRATEGY_TYPES.
function strat(type) {
  const map = { defense:'🛡️ Defense', attack:'⚔️ Attack', economy:'💰 Economy', growth:'🌱 Growth' };
  return map[type] || type;
}

function fmtTs(s) {
  if (!s) return '—';
  const d = new Date(s.includes('T') ? s : s.replace(' ','T') + 'Z');
  const now = Date.now();
  const diff = Math.floor((now - d) / 1000);
  if (diff < 120) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  return d.toLocaleDateString();
}

function fmtDate(s) {
  if (!s) return '—';
  const d = new Date(s.includes('T') ? s : s.replace(' ','T') + 'Z');
  return d.toLocaleString([], { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

// Base strategy weights (config.yaml strategy.weights). Personality multipliers
// from the API re-scale these; every bot has ALL capabilities regardless.
const BASE_WEIGHTS = { defense: 3, attack: 2 };

const PERSONALITY_ICON = {
  aggressive: '⚔️', defensive: '🛡️', balanced: '⚖️',
};

function skillGroup(title, items, weightBadge) {
  const rows = items.map(s => `
    <div class="skill">
      <span class="skill-icon">${s.icon}</span>
      <div>
        <div class="skill-name">${s.name}</div>
        <div class="skill-desc">${s.desc}</div>
      </div>
    </div>`).join('');
  return `<div class="skill-group">
    <div class="skill-group-head">
      <span>${title}</span>${weightBadge || ''}
    </div>
    ${rows}
  </div>`;
}

// Every bot has ALL skills; personality only re-weights strategy frequency.
function buildSkills(bot) {
  const mult = (PERSONALITIES[bot.personality] || {});
  const stratOrder = ['defense', 'attack'];
  const groups = [skillGroup('Always-on (baseline)', SKILLS.all)];
  for (const t of stratOrder) {
    const base = BASE_WEIGHTS[t] || 0;
    const m = (mult[t] != null) ? mult[t] : 1;
    const eff = +(base * m).toFixed(1);
    const cls = m > 1.2 ? 'up' : m < 0.8 ? 'down' : '';
    const badge = `<span class="weight-badge ${cls}" title="base ${base} × ${m} personality">`
      + `weight ${eff}${m !== 1 ? ` (×${m})` : ''}</span>`;
    groups.push(skillGroup(strat(t), SKILLS[t] || [], badge));
  }
  return groups.join('');
}

// Strategy Gantt chart for the last 24 h. Each history entry's `ts` is its
// start; a strategy runs until the next entry starts (or until now for the
// last one). Segments are clipped to the 24 h window and laid out as
// proportionally-sized bars.
function buildGantt(bot) {
  const WINDOW_MS = 24 * 3600 * 1000;
  const now = Date.now();
  const start = now - WINDOW_MS;
  const parse = s => new Date(s.includes('T') ? s : s.replace(' ', 'T') + 'Z').getTime();

  // Dedup + sort ascending by start time.
  const seen = new Set();
  const hist = (bot.strategy_history_48h || []).filter(h => {
    const k = h.ts + h.type + (h.source || '');
    if (seen.has(k)) return false; seen.add(k); return true;
  }).map(h => ({ ...h, t: parse(h.ts) }))
    .sort((a, b) => a.t - b.t);

  if (hist.length === 0)
    return `<p class="empty-msg">No strategy changes in the last 24 h</p>`;

  // Build [from, to) segments; last runs to now.
  const segs = hist.map((h, i) => ({
    type: h.type, source: h.source,
    from: h.t, to: i + 1 < hist.length ? hist[i + 1].t : now,
  })).filter(s => s.to > start && s.from < now);

  if (segs.length === 0)
    return `<p class="empty-msg">No strategy changes in the last 24 h</p>`;

  const bars = segs.map(s => {
    const from = Math.max(s.from, start);
    const to = Math.min(s.to, now);
    const left = (from - start) / WINDOW_MS * 100;
    const width = (to - from) / WINDOW_MS * 100;
    const isBreach = s.source === 'breach';
    const cls = `gantt-bar ${s.type || 'unknown'}${isBreach ? ' breach' : ''}`;
    const dur = Math.round((to - from) / 60000);
    const label = width > 8 ? strat(s.type) : '';
    const title = `${strat(s.type)}${s.source ? ' (' + s.source + ')' : ''} · `
      + `${fmtDate(new Date(from).toISOString())} → ${fmtDate(new Date(to).toISOString())} · ${dur} min`;
    return `<div class="${cls}" style="left:${left}%;width:${width}%" title="${title}">${label}</div>`;
  }).join('');

  return `<div class="gantt">
    <div class="gantt-track">${bars}</div>
    <div class="gantt-axis"><span>24 h ago</span><span>12 h</span><span>now</span></div>
  </div>`;
}

// Overall winrate (since season start — battle_log is wiped on season change,
// see run_bot.py::_check_season_reset) plus a per-era breakdown.
function buildWinrate(bot) {
  const season = bot.winrate_season || { total: 0 };
  if (!season.total) return '<p class="empty-msg">No battles yet this season</p>';
  const pct = Math.round((season.rate || 0) * 100);
  const cls = pct >= 60 ? 'accent' : pct >= 40 ? 'warning' : 'danger';
  const byEra = bot.winrate_by_era || {};
  const eraRows = ERA_ORDER
    .filter(e => byEra[e] && byEra[e].total)
    .map(e => {
      const r = byEra[e];
      const p = Math.round((r.rate || 0) * 100);
      return `<div class="era-row">
        <span class="era-name">${e}</span>
        <span class="era-bar-track"><span class="era-bar-fill" style="width:${p}%"></span></span>
        <span class="era-count">${p}% (${r.wins}/${r.total})</span>
      </div>`;
    }).join('');
  return `<div class="winrate-block">
    <div class="winrate-big">
      <span class="value ${cls}">${pct}%</span>
      <span class="label">${season.wins}W / ${season.losses}L this season</span>
    </div>
    <div class="era-rates">${eraRows}</div>
  </div>`;
}

// Two compact rows of win/loss dots for the last 10 battles per role.
function buildLast10(bot) {
  const row = (label, entries) => {
    if (!entries || !entries.length)
      return `<div class="last10-row"><span class="last10-label">${label}</span><span class="empty-msg">none yet</span></div>`;
    const dots = entries.map(e => {
      const cls = e.won ? 'win' : 'loss';
      const title = `${e.won ? 'Won' : 'Lost'} · ${e.era || '?'} vs ${e.opponent || '?'} · ${fmtDate(e.ts)}`;
      return `<span class="last10-dot ${cls}" title="${title}"></span>`;
    }).join('');
    return `<div class="last10-row"><span class="last10-label">${label}</span><span class="last10-dots">${dots}</span></div>`;
  };
  return row('⚔️ Attack', bot.last10_attack) + row('🛡️ Defense', bot.last10_defense);
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Last 5 actual gold spends (see web/fastapi_server.py::_is_gold_action —
// research, relocation, wave-fill with an already-unlocked critter, ruler
// placement/skill-ups and spy/attack calls are free and excluded). Each
// entry shows which strategy was active at the moment the gold was spent,
// not the bot's current strategy — the two can differ once a switch has
// happened since.
function buildGoldSpends(bot) {
  const spends = bot.last_gold_spends || [];
  if (!spends.length)
    return '<p class="empty-msg">No gold spent yet</p>';
  const rows = spends.slice().reverse().map(s => {
    const stratType = s.strategy || 'unknown';
    return `<div class="goldspend-row">
      <span class="goldspend-desc">${escapeHtml(s.description)}</span>
      <span class="goldspend-strategy ${stratType}">${strat(stratType)}</span>
      <span class="goldspend-ts">${fmtDate(s.ts)}</span>
    </div>`;
  }).join('');
  return `<div class="goldspend-list">${rows}</div>`;
}

function buildCard(bot) {
  const stgy = bot.strategy || {};
  const type = stgy.type || 'unknown';
  const src = stgy.source || '';
  const srcTag = src === 'breach' ? `<span class="source-tag breach">breach</span>` :
                 src === 'override' ? `<span class="source-tag override">override</span>` :
                 `<span class="source-tag">${src}</span>`;
  const validUntil = stgy.valid_until
    ? `<span class="valid-until">until ${fmtDate(stgy.valid_until)}</span>` : '';

  const runtime = bot.runtime || {};
  const mem = bot.memory_summary || {};
  const breaches = mem.breaches || 0;
  const bClass = breaches > 20 ? 'danger' : breaches > 5 ? 'warning' : 'accent';

  // Savings goal
  const goal = mem.savings_goal;
  const goalHtml = goal ? `
    <div class="savings-goal">
      <span>💰</span>
      <div>
        <span class="sg-amount">${goal.amount.toLocaleString(undefined, {maximumFractionDigits:0})} gold</span>
        <div class="sg-meta">Saving for <strong>${goal.item}</strong> · expires ${fmtDate(goal.expires_at)}</div>
      </div>
    </div>` : '';

  return `
  <div class="bot-card" id="bot-${bot.name}">
    <div class="card-header">
      <div class="bot-dot"></div>
      <span class="bot-name">${bot.account?.empire_name || bot.name}</span>
      <span class="personality-tag ${bot.personality || 'balanced'}">${PERSONALITY_ICON[bot.personality] || '🎲'} ${bot.personality || 'balanced'}</span>
      <span class="bot-meta">
        uid ${bot.account?.uid || '?'} ·
        ${runtime.cycles?.toLocaleString() || 0} cycles ·
        last ${fmtTs(runtime.last_cycle)}
      </span>
      <button class="override-btn" onclick="openOverrideModal('${bot.name.replace(/'/g,"\\'")}', event)" title="Override strategy">⚡ Strategy</button>
      <button class="delete-btn" onclick="deleteBot('${bot.name.replace(/'/g,"\\'")}', event)" title="Delete bot">✕</button>
    </div>
    <div class="card-body">

      <!-- Capabilities (collapsible, default collapsed) -->
      <details class="capabilities">
        <summary>
          <span class="section-label" style="border:0;padding:0;margin:0">Capabilities</span>
          <span class="cap-hint">all bots share every skill · personality re-weights strategy choice</span>
        </summary>
        <div class="skills" style="margin-top:10px">${buildSkills(bot)}</div>
      </details>

      <!-- Current strategy -->
      <div>
        <div class="section-label">Current strategy</div>
        <div class="strategy-now" style="margin-top:8px">
          <span class="strat-badge ${type}">${strat(type)}</span>
          ${srcTag}
          ${validUntil}
        </div>
      </div>

      <!-- Key stats -->
      <div class="stats-row">
        <div class="stat-box">
          <div class="label">Breaches</div>
          <div class="value ${bClass}">${breaches}</div>
        </div>
        <div class="stat-box">
          <div class="label">Attacks</div>
          <div class="value">${mem.attack_history_count || 0}</div>
        </div>
      </div>

      ${goalHtml}

      <!-- Winrate since season start -->
      <div>
        <div class="section-label">Winrate — since season start</div>
        <div style="margin-top:8px">${buildWinrate(bot)}</div>
      </div>

      <!-- Last 10 battles -->
      <div>
        <div class="section-label">Last 10 battles</div>
        <div style="margin-top:6px;display:flex;flex-direction:column;gap:4px">${buildLast10(bot)}</div>
      </div>

      <!-- Last 5 gold spends, newest first -->
      <div>
        <div class="section-label">Last 5 gold spends</div>
        <div style="margin-top:8px">${buildGoldSpends(bot)}</div>
      </div>

      <!-- Strategy timeline — defense/attack phases only -->
      <div>
        <div class="section-label">Strategy timeline — last 24 h</div>
        ${buildGantt(bot)}
      </div>

    </div>
  </div>`;
}

function openSpawnModal() {
  document.getElementById('spawnModal').classList.remove('hidden');
  document.getElementById('spawnName').value = '';
  document.getElementById('spawnPersonality').value = '';
  document.getElementById('spawnSubmit').disabled = false;
  setTimeout(() => document.getElementById('spawnName').focus(), 50);
}

function closeSpawnModal() {
  document.getElementById('spawnModal').classList.add('hidden');
}

async function spawnBot() {
  const name = document.getElementById('spawnName').value.trim();
  const personality = document.getElementById('spawnPersonality').value;
  const btn = document.getElementById('spawnSubmit');
  btn.disabled = true;
  btn.textContent = 'Spawning…';
  try {
    const res = await fetch(`${GS_BASE}/api/tools/bots`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name: name || undefined, personality: personality || undefined }),
    });
    const data = await res.json();
    if (!res.ok) {
      alert(`Failed: ${data.detail || res.status}`);
      btn.disabled = false;
      btn.textContent = 'Spawn';
      return;
    }
    closeSpawnModal();
    await load();
  } catch (e) {
    alert(`Error: ${e.message}`);
    btn.disabled = false;
    btn.textContent = 'Spawn';
  }
}

async function deleteBot(name, ev) {
  ev.stopPropagation();
  if (!confirm(`Delete bot "${name}"? This removes the state file and log permanently.`)) return;
  try {
    const res = await fetch(`${GS_BASE}/api/tools/bots/${encodeURIComponent(name)}`, { method: 'DELETE' });
    const data = await res.json();
    if (!res.ok) {
      alert(`Failed: ${data.detail || res.status}`);
      return;
    }
    await load();
  } catch (e) {
    alert(`Error: ${e.message}`);
  }
}

// ── Strategy override ──────────────────────────────────────────────────────
let _overrideBotName = '';
let _empireList = [];

async function openOverrideModal(name, ev) {
  ev.stopPropagation();
  _overrideBotName = name;
  document.getElementById('overrideBotName').textContent = name;
  document.getElementById('overrideType').value = 'attack';
  document.getElementById('overrideDuration').value = '2';
  document.getElementById('overrideError').style.display = 'none';
  document.getElementById('overrideSubmit').disabled = false;
  document.getElementById('overrideSubmit').textContent = 'Override';
  updateOverrideFields();

  // Fetch empire list for target selector
  try {
    const token = localStorage.getItem('e3_jwt_token');
    const headers = token ? { 'Authorization': 'Bearer ' + token } : {};
    const res = await fetch(`${GS_BASE}/api/empires`, { headers });
    const data = await res.json();
    _empireList = (data.empires || []).filter(e => !e.is_self);
  } catch { _empireList = []; }
  const sel = document.getElementById('overrideTarget');
  sel.innerHTML = _empireList.length
    ? _empireList.map(e => `<option value="${e.uid}:${e.name.replace(/"/g,'')}">${e.name}</option>`).join('')
    : '<option value="">No empires found</option>';

  document.getElementById('overrideModal').classList.remove('hidden');
}

function closeOverrideModal() {
  document.getElementById('overrideModal').classList.add('hidden');
}

function updateOverrideFields() {
  const type = document.getElementById('overrideType').value;
  const needsTarget = type === 'attack';
  document.getElementById('overrideTargetRow').classList.toggle('hidden', !needsTarget);
}

async function submitOverride() {
  const type = document.getElementById('overrideType').value;
  const hours = parseFloat(document.getElementById('overrideDuration').value) || 2;
  const errEl = document.getElementById('overrideError');
  errEl.style.display = 'none';

  const payload = { type, duration_hours: hours };

  if (type === 'attack') {
    const val = document.getElementById('overrideTarget').value;
    if (!val) { errEl.textContent = 'Select a target.'; errEl.style.display = ''; return; }
    const [uid, ...nameParts] = val.split(':');
    payload.params = { target_uid: parseInt(uid), target_name: nameParts.join(':'), phase: 'strengthen' };
  }

  const btn = document.getElementById('overrideSubmit');
  btn.disabled = true;
  btn.textContent = 'Sending…';

  try {
    const res = await fetch(`${GS_BASE}/api/tools/bots/${encodeURIComponent(_overrideBotName)}/strategy`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) {
      errEl.textContent = data.detail || `Error ${res.status}`;
      errEl.style.display = '';
      btn.disabled = false;
      btn.textContent = 'Override';
      return;
    }
    closeOverrideModal();
    await load();
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = '';
    btn.disabled = false;
    btn.textContent = 'Override';
  }
}

async function load() {
  try {
    const res = await fetch(`${GS_BASE}/api/tools/bots`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    PERSONALITIES = data.personalities || {};
    const bots = data.bots || [];
    const grid = document.getElementById('grid');
    if (bots.length === 0) {
      grid.innerHTML = '<p style="padding:24px;color:var(--text-dim)">No bot state files found in ai_players/states/.</p>';
    } else {
      grid.innerHTML = bots.map(buildCard).join('');
    }
    document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('grid').innerHTML =
      `<p style="padding:24px;color:var(--danger)">Error: ${e.message}</p>`;
  }
}

load();
setInterval(load, 30_000);
</script>
