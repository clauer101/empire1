<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Critters</title>
  <style>
    :root {
      --bg:       #0d0d14;
      --surface:  #14141f;
      --surface-alt: #1a1a28;
      --border:   #2a2a3a;
      --accent:   #4fc3f7;
      --text:     #e0e0e6;
      --text-dim: #9999a8;
      --radius:   6px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; font-size: 13px; min-height: 100vh; }

    /* ── Topbar ─────────────────────────────────────────────────── */
    #topbar {
      position: sticky; top: 38px; z-index: 100;
      background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 14px; padding: 10px 20px; flex-wrap: wrap;
    }
    #topbar h1 { font-size: 1rem; color: var(--accent); letter-spacing: 1px; flex: 1; min-width: 120px; }
    #topbar label { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
    #topbar input[type=range] { width: 110px; }
    #topbar select, #topbar input[type=number] {
      background: var(--surface-alt); border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--text); font-size: 12px; padding: 3px 7px;
    }
    #zoom-val { font-size: 12px; color: var(--accent); min-width: 28px; }
    #gallery-status { font-size: 12px; color: var(--text-dim); }
    /* ── Gallery ────────────────────────────────────────────────── */
    #panel-gallery { padding: 24px 20px 60px; }
    .era-section { margin-bottom: 32px; }
    .era-heading {
      font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      color: var(--text-dim); padding-bottom: 6px; margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .grid-canvas-wrap { position: relative; }
    canvas.grid-canvas { display: block; image-rendering: pixelated; }
    .gif-overlay { position: absolute; top: 0; left: 0; pointer-events: none; }
    .gif-overlay img { position: absolute; image-rendering: pixelated; transform: translate(-50%, -50%); }

  </style>
</head>
<body>
<script src="nav.js"></script>

<div id="topbar">
  <h1>🐾 Critters</h1>

  <label title="Same as the battle map zoom (battle allows up to 3×)">
    Battle zoom
    <input type="range" id="zoom-slider" min="0.5" max="8" step="0.5" value="3" />
    <span id="zoom-val">3×</span>
  </label>
  <label title="Rulers grow with their level">
    Ruler level
    <input type="number" id="ruler-level" value="1" min="1" max="1" style="width:46px;" />
  </label>
  <label>
    Direction
    <select id="dir-select">
      <option value="forward">Forward</option>
      <option value="left">Left</option>
      <option value="right">Right</option>
      <option value="backward">Backward</option>
    </select>
  </label>
  <span id="gallery-status">Loading…</span>
</div>

<div id="panel-gallery"></div>

<!-- ═══════════════════════════════════════════════════════ GALLERY ═══ -->
<script type="module">
import { CritterSprite, critterSpriteWidth, critterSpriteCenterY } from '../js/lib/critter_sprite.js';
import { hexCorners } from '../js/lib/hex.js';

/** Hex radius used by the battle views (defense/replay/composer). */
const HEX_SIZE = 28;
const ERA_ORDER  = ['stone','neolithic','bronze','iron','medieval','renaissance','industrial','modern','future','rulers','unused'];
const ERA_LABELS = {
  stone:'Stone Age', neolithic:'Neolithic', bronze:'Bronze Age', iron:'Iron Age',
  medieval:'Medieval', renaissance:'Renaissance', industrial:'Industrial',
  modern:'Modern', future:'Future', rulers:'Rulers', unused:'Sprites not used by any critter',
};

let zoomFactor = 3;
let rulerLevel = 1;
let direction  = 'forward';
let critters   = [];
let rafId      = null;

async function loadAll() {
  const [manifestResp, statsArr] = await Promise.all([
    fetch('/api/critters').then(r => r.json()),
    fetch('/api/critter-stats').then(r => r.json()).catch(() => []),
  ]);
  const statsMap = new Map();
  for (const c of (Array.isArray(statsArr) ? statsArr : [])) statsMap.set(c.iid.toLowerCase(), c);
  const entries = manifestResp.critters || [];
  document.getElementById('gallery-status').textContent = `${entries.length} critters`;

  critters = await Promise.all(entries.map(async entry => {
    const sprite = CritterSprite.fromManifest(entry);
    await sprite.load().catch(() => {});
    // Manifest entries are sprite folders; entry.iid names the critter whose
    // YAML animation points at that folder (absent → folder unused).
    const iid = entry.iid ?? '';
    const st = statsMap.get(iid.toLowerCase());
    const era = entry.name.startsWith('ruler_') ? 'rulers' : (iid ? (st?.era ?? 'stone') : 'unused');
    const label = !iid || iid.toLowerCase() === entry.name ? entry.name : `${iid.toLowerCase()} [${entry.name}]`;
    return {
      name: label, sprite, era,
      scale: entry.scale ?? 1.0, scaleByLevel: entry.scale_by_level ?? null, yOffset: entry.sprite_y_offset ?? 0,
    };
  }));

  // Max ruler level comes from the backend's per-level scale table.
  const maxLevel = Math.max(1, ...critters.map(c => c.scaleByLevel?.length ?? 1));
  document.getElementById('ruler-level').max = maxLevel;

  buildGrid();
  startLoop();
}

/** Battle scale from the backend; rulers use the selected level. */
function battleScale(c) {
  if (!c.scaleByLevel) return c.scale;
  return c.scaleByLevel[Math.min(rulerLevel, c.scaleByLevel.length) - 1];
}

/** Sprite width on screen — the battle formula times the zoom. */
function spriteWidth(c) {
  return critterSpriteWidth(HEX_SIZE, battleScale(c)) * zoomFactor;
}

/** Sprite height; in battle the sprite center sits half a width above the hex center. */
function spriteHeight(c) {
  const aspect = (c.sprite.frameW > 0 && c.sprite.frameH > 0) ? c.sprite.frameH / c.sprite.frameW : 1;
  return spriteWidth(c) * aspect;
}

/** Sprite center Y for a critter standing on y — same placement as battle. */
function spriteCenterY(c, y) {
  return critterSpriteCenterY(y, spriteWidth(c), c.sprite, c.yOffset);
}

const LABEL_H = 26;

function cellSize() {
  const hexR = HEX_SIZE * zoomFactor;
  let need = 2 * hexR;
  for (const c of critters) {
    // Sprite top relative to the hex center (center from the battle formula).
    const up = -spriteCenterY(c, 0) + spriteHeight(c) / 2;
    need = Math.max(need, 2 * up);
  }
  return Math.ceil(Math.max(need, 2 * hexR) + LABEL_H + 8);
}

/** Hex center of a grid cell — leaves room above for the sprite and below for the label. */
function hexCenterY(row, cell) {
  return row * cell + 4 + (cell - LABEL_H - 8) / 2;
}

function drawHex(ctx, cx, cy) {
  const pts = hexCorners(cx, cy, HEX_SIZE * zoomFactor);
  ctx.beginPath();
  pts.forEach((pt, i) => (i ? ctx.lineTo(pt.x, pt.y) : ctx.moveTo(pt.x, pt.y)));
  ctx.closePath();
  ctx.fillStyle = '#1a1a28';
  ctx.fill();
  ctx.strokeStyle = '#33334a';
  ctx.stroke();
}

const COLS = 8;

function buildGrid() {
  const content = document.getElementById('panel-gallery');
  content.innerHTML = '';

  const byEra = new Map(ERA_ORDER.map(e => [e, []]));
  for (const c of critters) {
    const era = c.era || 'stone';
    if (!byEra.has(era)) byEra.set(era, []);
    byEra.get(era).push(c);
  }

  const cell = cellSize();

  for (const era of ERA_ORDER) {
    const group = byEra.get(era) || [];
    if (group.length === 0) continue;

    const section = document.createElement('div');
    section.className = 'era-section';
    const heading = document.createElement('div');
    heading.className = 'era-heading';
    heading.textContent = `${ERA_LABELS[era] ?? era}  (${group.length})`;
    section.appendChild(heading);

    const cols = Math.min(COLS, group.length);
    const rows = Math.ceil(group.length / COLS);
    const W    = cols * cell;
    const H    = rows * cell;
    const dpr  = window.devicePixelRatio || 1;

    const wrap = document.createElement('div');
    wrap.className = 'grid-canvas-wrap';
    wrap.style.width = W + 'px';
    wrap.style.height = H + 'px';

    const canvas = document.createElement('canvas');
    canvas.className = 'grid-canvas';
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    canvas.dataset.era  = era;
    wrap.appendChild(canvas);

    const gifDiv = document.createElement('div');
    gifDiv.className = 'gif-overlay';
    gifDiv.style.width  = W + 'px';
    gifDiv.style.height = H + 'px';
    gifDiv.dataset.era  = era;

    group.forEach((c, i) => {
      const col = i % COLS;
      const row = Math.floor(i / COLS);
      const cx  = col * cell + cell / 2;
      const cy  = hexCenterY(row, cell);
      if (c.sprite.type === 'gifs') {
        const spriteW = spriteWidth(c);
        const img = c.sprite.getImg(direction);
        if (img) {
          const el = img.cloneNode();
          el.style.width  = spriteW + 'px';
          el.style.height = 'auto';
          el.style.left   = cx + 'px';
          el.style.top    = spriteCenterY(c, cy) + 'px';
          gifDiv.appendChild(el);
        }
      }
    });

    wrap.appendChild(gifDiv);
    section.appendChild(wrap);
    content.appendChild(section);
  }
}

function startLoop() {
  if (rafId) cancelAnimationFrame(rafId);
  const byEra = new Map(ERA_ORDER.map(e => [e, []]));
  for (const c of critters) {
    const era = c.era || 'stone';
    if (!byEra.has(era)) byEra.set(era, []);
    byEra.get(era).push(c);
  }
  const dpr = window.devicePixelRatio || 1;

  function loop(ts) {
    const cell = cellSize();
    for (const era of ERA_ORDER) {
      const group = byEra.get(era) || [];
      if (group.length === 0) continue;
      const canvas = document.querySelector(`canvas.grid-canvas[data-era="${era}"]`);
      if (!canvas) continue;
      const ctx = canvas.getContext('2d');
      ctx.save();
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#1e1e2e';
      ctx.lineWidth = 1;
      const cols = Math.min(COLS, group.length);
      const rows = Math.ceil(group.length / COLS);
      for (let c = 0; c <= cols; c++) {
        ctx.beginPath(); ctx.moveTo(c * cell, 0); ctx.lineTo(c * cell, rows * cell); ctx.stroke();
      }
      for (let r = 0; r <= rows; r++) {
        ctx.beginPath(); ctx.moveTo(0, r * cell); ctx.lineTo(cols * cell, r * cell); ctx.stroke();
      }
      group.forEach((c, i) => {
        const col = i % COLS;
        const row = Math.floor(i / COLS);
        const cx  = col * cell + cell / 2;
        const cy  = hexCenterY(row, cell);
        drawHex(ctx, cx, cy);
        if (c.sprite.type === 'spritesheet' && c.sprite.ready) {
          c.sprite.draw(ctx, direction, ts, cx, spriteCenterY(c, cy), spriteWidth(c));
        }
        ctx.font      = '11px monospace';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#888';
        ctx.fillText(c.name, cx, row * cell + cell - 15);
        ctx.fillStyle = '#5a5a70';
        const offsetTxt = c.yOffset ? `  y ${c.yOffset > 0 ? '+' : ''}${c.yOffset}` : '';
        ctx.fillText(`scale ${battleScale(c)}${offsetTxt}`, cx, row * cell + cell - 3);
      });
      ctx.restore();
    }
    rafId = requestAnimationFrame(loop);
  }
  rafId = requestAnimationFrame(loop);
}

function rebuild() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  buildGrid();
  startLoop();
}

document.getElementById('zoom-slider').addEventListener('input', e => {
  zoomFactor = parseFloat(e.target.value);
  document.getElementById('zoom-val').textContent = zoomFactor + '×';
  rebuild();
});
document.getElementById('dir-select').addEventListener('change', e => {
  direction = e.target.value;
  rebuild();
});

document.getElementById('ruler-level').addEventListener('input', e => {
  rulerLevel = Math.max(1, Math.min(Number(e.target.max), parseInt(e.target.value, 10) || 1));
  rebuild();
});

loadAll();
</script>

</body>
</html>
