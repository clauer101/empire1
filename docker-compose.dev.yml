name: empire1-dev

services:
  gameserver:
    build:
      context: .
      target: gameserver
    image: empire1-gameserver-dev
    restart: unless-stopped
    env_file: .env.dev
    stop_grace_period: 30s
    environment:
      WEB_DIR: /app/web
      IS_DEV: "true"
    ports:
      - "127.0.0.1:8180:8080"
      - "127.0.0.1:8865:8765"
    volumes:
      - ./data/dev:/app/data
      - ./data/dev/logs:/app/logs
      - ./python_server/config:/app/config
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  webserver:
    build:
      context: .
      target: webserver
    image: empire1-webserver-dev
    restart: unless-stopped
    env_file: .env.dev
    environment:
      BUILD_MODE: production
      BOTS_HOST: bots
    ports:
      - "127.0.0.1:8100:8000"
    volumes:
      - ./python_server/config:/app/config
      - ./ai_players:/app/ai_players:ro
      - ./data/dev/bot_states:/app/ai_players/states
      - ./data/dev/bot_logs:/app/ai_players/logs
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  bots:
    build:
      context: .
      target: bots
    image: empire1-bots-dev
    restart: unless-stopped
    environment:
      SERVER_URL: http://gameserver:8080
      BOT_COUNT: "3"
    volumes:
      - ./data/dev/bot_states:/app/states
      - ./data/dev/bot_logs:/app/logs
    depends_on:
      gameserver:
        condition: service_healthy

