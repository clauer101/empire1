name: empire1-prod

services:
  gameserver:
    build:
      context: .
      target: gameserver
    image: empire1-gameserver
    restart: unless-stopped
    env_file: .env
    stop_grace_period: 30s
    environment:
      WEB_DIR: /app/web
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8765:8765"
    volumes:
      - ./data/prod:/app/data
      - ./data/prod/logs:/app/logs
      - ./python_server/config:/app/config
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  webserver:
    build:
      context: .
      target: webserver
    image: empire1-webserver
    restart: unless-stopped
    env_file: .env
    environment:
      BOTS_HOST: bots
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./python_server/config:/app/config
      - ./ai_players:/app/ai_players:ro
      - ./data/prod/bot_states:/app/ai_players/states
      - ./data/prod/bot_logs:/app/ai_players/logs
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  bots:
    build:
      context: .
      target: bots
    image: empire1-bots
    restart: unless-stopped
    environment:
      SERVER_URL: http://gameserver:8080
      BOT_COUNT: "3"
    volumes:
      - ./data/prod/bot_states:/app/states
      - ./data/prod/bot_logs:/app/logs
    depends_on:
      gameserver:
        condition: service_healthy

