# Target maze length (spawn-to-castle path length, in tiles) per era — a
# balancing parameter for auto-generated mazes (gameserver/engine/maze_generator.py):
# each generated maze picks a random target corridor length within [min_length,
# max_length] for its era and stops growing once the corridor reaches it;
# min_towers/max_towers similarly bound the tower count walling that corridor.
# For a random maze, total tile count = corridor length (path) + tower count.
#
# stone, neolithic, industrial and modern are calibrated against real live
# empires' hex_map (data/prod state snapshots, 2026-08-24 - 2026-09-11),
# Tukey-IQR-outlier-trimmed (e.g. a stone-era empire that hoarded gold for
# weeks without advancing eras, or a medieval empire with a 65-tile path but
# only 3 towers — accumulated open land, not a built maze), then
# hand-validated/adjusted (e.g. stone's real median is a literal point —
# path 2/2, towers 0/0 — nudged to 1-3/1-3 so the generator still grows the
# corridor and places at least one tower).
# bronze, iron, medieval and renaissance are linearly interpolated between
# the neolithic and industrial anchors — not independently observed.
# future is linearly extrapolated from the industrial->modern slope, one
# era further — no empire has reached "future" in any recorded season.
# Re-calibrate the interpolated/extrapolated eras against real data once
# enough empires reach them.
maze_length:
  stone:
    min_length: 2
    max_length: 3
    min_towers: 1
    max_towers: 3
  neolithic:
    min_length: 3
    max_length: 6
    min_towers: 3
    max_towers: 10
  bronze:
    min_length: 5
    max_length: 12
    min_towers: 9
    max_towers: 17
  iron:
    min_length: 8
    max_length: 18
    min_towers: 14
    max_towers: 23
  medieval:
    min_length: 12
    max_length: 24
    min_towers: 20
    max_towers: 30
  renaissance:
    min_length: 15
    max_length: 30
    min_towers: 25
    max_towers: 36
  industrial:
    min_length: 18
    max_length: 36
    min_towers: 31
    max_towers: 43
  modern:
    min_length: 25
    max_length: 40
    min_towers: 38
    max_towers: 49
  future:
    min_length: 32
    max_length: 44
    min_towers: 45  # extrapolated, no observed data
    max_towers: 55  # extrapolated, no observed data
